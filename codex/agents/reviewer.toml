# Codex subagent role "reviewer": Independent, adversarial review of a plan or diff. Strongest tier for judgment.
# Referenced by [agents.reviewer].config_file in codex/config-base.toml and deployed
# to ~/.codex/agents/. Uncomment model to run this role on a cheaper or
# stronger model than the driver; the Codex config reference documents the
# fallback when it is unset.
# model = "<model for this role>"
model_reasoning_effort = "high"
